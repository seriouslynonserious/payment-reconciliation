services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: reconciliation
      POSTGRES_PASSWORD: local_demo_only
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconciliation -d reconciliation"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql://reconciliation:local_demo_only@db:5432/reconciliation
      LOAD_SAMPLE_DATA: "true"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
